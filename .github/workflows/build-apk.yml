name: Build VISIT KOLWEZI APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Décompresser le projet
        run: |
          mkdir project
          unzip -q *.zip -d project
          cp -r project/VISIT-KOLWEZI-Android/. .

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Installer Android SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Compiler VISIT KOLWEZI
        run: gradle --no-daemon :app:assembleDebug

      - name: Préparer APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VISIT-KOLWEZI.apk

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: VISIT-KOLWEZI-apk
          path: VISIT-KOLWEZI.apk
