name: Build VISIT KOLWEZI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Compiler VISIT KOLWEZI
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Décompresser le projet Android
        shell: bash
        run: |
          set -e
          mkdir -p extracted
          unzip -q VISIT-KOLWEZI-GITHUB-COMPILATION-PACK.zip -d extracted
          cp -a extracted/VISIT-KOLWEZI-Android/. ./android-project/

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler l'application
        shell: bash
        working-directory: android-project
        run: |
          set -e
          gradle --no-daemon --stacktrace assembleDebug

      - name: Renommer l'APK
        shell: bash
        run: |
          set -e
          cp android-project/app/build/outputs/apk/debug/app-debug.apk \
             VISIT-KOLWEZI.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: VISIT-KOLWEZI-apk
          path: VISIT-KOLWEZI.apk
